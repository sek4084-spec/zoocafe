<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZOO:CAFE Living World 테스트</title><style>
*{box-sizing:border-box}body{margin:0;background:#211810;color:#fff2df;font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;touch-action:none;background:#57412b}.back{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;pointer-events:none;filter:saturate(.95)}.veil{position:absolute;inset:0;background:linear-gradient(0deg,#160d0799,transparent 35%,#170e0770)}.top{position:absolute;top:env(safe-area-inset-top);left:8px;right:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;z-index:30}.brand{font-weight:900;background:#4a3025dd;border:1px solid #e9c591;border-radius:15px;padding:10px}.btn{background:#503a2ddd;color:#fff0d4;border:1px solid #e9c59177;border-radius:13px;padding:10px;cursor:pointer;font-weight:700}.btn.active{background:#b87d3d}.status{position:absolute;top:70px;left:12px;z-index:20;background:#2a1b16b8;border-radius:12px;padding:7px 11px;font-size:12px;max-width:70vw}.actor{position:absolute;width:105px;height:118px;transform:translate(-50%,-100%);z-index:9;transition:left 1.5s linear,top 1.5s linear;pointer-events:auto;cursor:pointer}.actor img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 6px 2px #22160b99)}.actor .name{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#503325ed;border:1px solid #e7c292;border-radius:12px;padding:2px 9px;font-size:12px}.speech{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);min-width:125px;max-width:190px;width:max-content;background:#fff6e7;color:#402a1d;border:2px solid #76503a;border-radius:16px;padding:9px 11px;font-size:13px;font-weight:700;line-height:1.45;box-shadow:0 5px 12px #0005;white-space:normal}.speech:after{content:'';position:absolute;top:100%;left:calc(50% - 8px);border:8px solid transparent;border-top-color:#76503a}.speech[hidden]{display:none}.bottom{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;z-index:30;background:#35241edc;border:1px solid #b38a64;border-radius:18px;padding:10px;max-width:640px;margin:auto}.log{font-size:12px;max-height:80px;overflow:auto;line-height:1.65;margin-bottom:8px}.chat{display:flex;gap:6px}.chat input{min-width:0;flex:1;border:1px solid #ad8a65;background:#fdf4e8;border-radius:10px;padding:11px;color:#36261b;font-size:14px}.chat button{background:#c18c54;color:#25170e;border:0;border-radius:10px;padding:9px 14px;font-weight:900}.help{font-size:11px;color:#e7c8a3;margin:0 0 5px}.actor.walk img{animation:bob .35s infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}@media(max-width:650px){.actor{width:77px;height:94px}.speech{min-width:98px;max-width:130px;font-size:11px;padding:6px}.top{gap:4px}.brand,.btn{font-size:12px;padding:8px}.status{top:62px}}
</style></head><body><div class="stage" id="stage"><video class="back" id="back" src="video/cafe-living-v54.mp4" autoplay muted loop playsinline></video><div class="veil"></div><div class="top"><div class="brand">☕ ZOO:CAFE · Living Test</div><button class="btn" id="visitorBtn">🐱 손님 방문</button><button class="btn" id="autoBtn">⏸ 자율 행동</button><button class="btn" id="bgBtn">🎞 배경 전환</button><button class="btn" id="resetBtn">↺ 초기화</button></div><div class="status" id="status">NPC가 알아서 움직이고 대화해요. 캐릭터를 눌러보세요.</div><div class="actor" id="mung"><div class="speech" hidden></div><img src="images/mung-saja-down-1.png"><div class="name">🦁 멍사자</div></div><div class="actor" id="rabbit"><div class="speech" hidden></div><img src="images/rabbit/rabbit-down-1.png"><div class="name">🐰 쥐무는토끼</div></div><div class="actor" id="visitor" hidden><div class="speech" hidden></div><img src="images/cat-visitor-demo.svg"><div class="name">🐱 여행자</div></div><div class="bottom"><div class="help">테스트: NPC 이동 · 머리 위 말풍선 추적 · 자율 대화 · 랜덤 방문 / 기존 AI 채팅과는 별개인 시각화 프로토타입</div><div class="log" id="log"></div><div class="chat"><input id="message" placeholder="NPC에게 말 걸기 (예: 멍사자 안녕)"><button id="send">전송</button></div></div></div><script>
const $=id=>document.getElementById(id),stage=$('stage'),log=$('log');const chars={mung:{el:$('mung'),x:29,y:73,frames:'mung-saja',lines:['오늘은 따뜻한 라테가 잘 나가네.','토끼야, 잠깐 쉬면서 커피 마실래?','손님이 오면 반갑게 인사해야지.','카페 정리도 거의 끝났어.']},rabbit:{el:$('rabbit'),x:64,y:76,frames:'rabbit',lines:['원고를 조금 더 수정해야지…','멍사자, 커피 고마워.','이 풍경을 소설에 넣어볼까?','오늘은 아이디어가 잘 떠오르네.']},visitor:{el:$('visitor'),x:93,y:77,lines:['안녕하세요! 여기 처음 와요.','정말 멋진 카페네요.','커피 한 잔 주문할게요.']}};let running=true,visitorHere=false,tick=0,backMode=0;function place(c){c.el.style.left=c.x+'%';c.el.style.top=c.y+'%'}Object.values(chars).forEach(place);function write(who,msg){const p=document.createElement('div');p.textContent=`${who}: ${msg}`;log.appendChild(p);log.scrollTop=log.scrollHeight;while(log.children.length>15)log.firstChild.remove()}function say(key,msg,duration=5500){const c=chars[key],s=c.el.querySelector('.speech');s.textContent=msg;s.hidden=false;clearTimeout(c.hide);c.hide=setTimeout(()=>s.hidden=true,duration);write(c.el.querySelector('.name').textContent,msg)}function move(key,x,y){const c=chars[key];c.x=x;c.y=y;c.el.classList.add('walk');place(c);setTimeout(()=>c.el.classList.remove('walk'),1500)}function visit(){if(visitorHere){say('visitor','이제 슬슬 가볼게요. 다음에 또 만나요!');setTimeout(()=>{chars.visitor.el.hidden=true;visitorHere=false},4500);return}visitorHere=true;chars.visitor.el.hidden=false;move('visitor',82,76);setTimeout(()=>say('visitor',chars.visitor.lines[0]),1400);setTimeout(()=>say('mung','어서 오세요! 편하게 둘러보세요.'),3400)}function life(){if(!running)return;tick++;const m=chars.mung,r=chars.rabbit;if(tick%2){move('mung',23+Math.random()*19,68+Math.random()*9);say('mung',m.lines[Math.floor(Math.random()*m.lines.length)])}else{move('rabbit',55+Math.random()*17,70+Math.random()*7);say('rabbit',r.lines[Math.floor(Math.random()*r.lines.length)])}if(visitorHere&&tick%3===0){move('visitor',76+Math.random()*12,74+Math.random()*4);say('visitor',chars.visitor.lines[Math.floor(Math.random()*3)])}else if(!visitorHere&&Math.random()<.12)visit()}let timer=setInterval(life,8500);$('visitorBtn').onclick=visit;$('autoBtn').onclick=()=>{running=!running;$('autoBtn').textContent=running?'⏸ 자율 행동':'▶ 자율 행동';$('status').textContent=running?'자율 행동 진행 중':'자율 행동 일시정지'};$('bgBtn').onclick=()=>{backMode=(backMode+1)%3;const v=$('back');if(backMode===0){v.style.display='';stage.style.backgroundImage='none';$('status').textContent='동영상 배경 (기존 NPC가 영상 안에 포함될 수 있음)'}else{v.style.display='none';stage.style.backgroundImage=`linear-gradient(${backMode===1?'#6a432455':'#183a6855'},#301a1599),url(images/${backMode===1?'cafe-illustrated-v54.png':'cafe-v54-8-new.png'})`;stage.style.backgroundSize='cover';stage.style.backgroundPosition='center';$('status').textContent='대체 이미지 배경: 캐릭터 중복 여부 확인용'}};$('resetBtn').onclick=()=>location.reload();function send(){const input=$('message'),v=input.value.trim();if(!v)return;write('나',v);input.value='';const key=v.includes('토끼')?'rabbit':v.includes('손님')&&visitorHere?'visitor':'mung';say(key,key==='rabbit'?'응, 듣고 있어. 지금은 테스트용 응답이야.':key==='visitor'?'반가워요! 잠깐 구경 중이에요.':'반가워! 지금은 캐릭터 레이어 테스트 중이야. 기존 게임 AI는 원래 게임에서 작동해.')} $('send').onclick=send;$('message').onkeydown=e=>{if(e.key==='Enter')send()};Object.entries(chars).forEach(([k,c])=>c.el.onclick=()=>say(k,c.lines[Math.floor(Math.random()*c.lines.length)]));write('시스템','NPC가 스스로 움직이기 시작했어요.');setTimeout(()=>say('mung','오늘도 카페 문을 열었어!'),1000);$('back').play().catch(()=>{});
</script></body></html>
